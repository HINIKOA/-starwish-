<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星魂 SoulStar · 宇宙之眼</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/core.css">
<link rel="stylesheet" href="/static/eye.css">
</head>
<body class="page">
<div class="sky"></div>
<header class="ctop">
  <a class="back" href="/">← 星图</a>
  <div class="brand"><span class="logo">👁</span> 宇宙之眼 <small>COSMIC EYE · 一起看</small></div>
  <div id="liveBadge" class="live hidden" title="正在看你的画面，点这里立即停止">● 正在看 <span id="liveTime">00:00</span></div>
  <div class="cmeta" id="emeta"></div>
</header>
<main class="cwrap wide">
  <section class="intro" id="intro">正在加载…</section>
  <nav class="ctabs">
    <button data-tab="watch" class="on">观看</button>
    <button data-tab="diary">画面日记</button>
    <button data-tab="settings">设置</button>
  </nav>

  <section id="tab-watch" class="tab">
    <div class="eyegrid">
      <div class="stagecol">
        <div class="srcbar">
          <input id="title" placeholder="在看什么？（例如：星际穿越）" maxlength="60">
          <button data-src="screen" class="primary">🖥 共享屏幕 / 窗口</button>
          <button data-src="tab">🗂 标签页（含声音）</button>
          <button data-src="camera">📷 摄像头</button>
          <button id="stopBtn" class="danger hidden">■ 停止并存成星星</button>
        </div>
        <div id="eyeStage" class="eyestage">
          <video id="video" autoplay muted playsinline></video>
          <div id="crop" class="crop hidden"></div>
          <div id="placeholder" class="ph">还没开始看。<br>选上面一个画面来源，浏览器会弹窗让你挑选要共享的内容。<br><small>画面只在你的电脑里处理，默认不保存。</small></div>
        </div>
        <div class="tools">
          <button id="regionBtn" title="拖动框出只想让 AI 看的区域，省 token">⬚ 框选区域</button>
          <button id="fullBtn" class="hidden">全画面</button>
          <label class="sw"><input type="checkbox" id="micChk"> 🎙 语音对话</label>
          <label class="sw"><input type="checkbox" id="ttsChk"> 🔊 朗读</label>
          <select id="paceSel" title="主动吐槽的节奏">
            <option value="off">不主动说话</option><option value="calm">安静（30 秒）</option>
            <option value="normal">陪看（15 秒）</option><option value="chatty">话痨（8 秒）</option>
          </select>
          <span class="meter" title="画面变化分（切场景时会跳高）"><i id="meterBar"></i></span>
        </div>
        <div class="filmstrip" id="strip"></div>
      </div>
      <div class="chatcol">
        <div id="log" class="elog"><div class="empty">开始观看后，直接说话或打字就能问它。按 <b>H</b> 问「现在这个画面怎么样」。</div></div>
        <div class="cmdbox">
          <input id="ask" placeholder="问它点什么…（回车发送）" autocomplete="off">
          <button id="askBtn" class="primary">发送</button>
        </div>
        <div class="stat" id="stat"></div>
      </div>
    </div>
  </section>

  <section id="tab-diary" class="tab hidden"></section>
  <section id="tab-settings" class="tab hidden"></section>
</main>
<div id="toast" class="hidden"></div>
<script type="module" src="/static/eye.js"></script>
</body>
</html>
