<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/static/favicon.ico"><link rel="apple-touch-icon" href="/static/icons/icon-180.png"><link rel="manifest" href="/static/manifest.json">
<title>星愿记忆 · 宇宙之眼</title>
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/core.css">
<link rel="stylesheet" href="/static/eye.css">
</head>
<body class="page eye-page">
<div class="sky"></div>
<header class="ctop">
  <a class="back" href="/">← 星图</a>
  <div class="brand"><span class="logo"><svg class="ico-eye" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-0.125em"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></span> 宇宙之眼 <small>COSMIC EYE · 一起看</small></div>
  <div id="liveBadge" class="live hidden" title="正在看你的画面，点这里立即停止">● 正在看 <span id="liveTime">00:00</span></div>
  <div class="cmeta" id="emeta"></div>
</header>
<main class="cwrap wide">
  <section class="intro" id="intro">正在加载…</section>
  <nav class="ctabs">
    <button data-tab="watch" class="on">观看</button>
    <button data-tab="diary">画面日记</button>
    <button data-tab="voices">声纹库</button>
    <button data-tab="settings">设置</button>
  </nav>

  <section id="tab-watch" class="tab">
    <div class="eyegrid">
      <div class="stagecol">
        <div class="srcbar">
          <input id="title" placeholder="在看什么？（例如：星际穿越）" maxlength="60">
          <button data-src="screen" class="primary" disabled>共享屏幕 / 窗口</button>
          <button data-src="tab" disabled>标签页（可含声音）</button>
          <button data-src="camera" disabled>摄像头</button>
          <button id="stopBtn" class="danger hidden">■ 停止并存成星星</button>
        </div>
        <div id="eyeStage" class="eyestage">
          <video id="video" autoplay muted playsinline></video>
          <div id="crop" class="crop hidden"></div>
          <div id="placeholder" class="ph">还没开始看。<br>选上面一个画面来源，再在浏览器里确认共享。<br><small>只在问答时发送选中的关键帧，默认不保存画面。</small></div>
        </div>
        <p id="captureHint" class="capture-hint hidden" role="status"></p>
        <div class="tools">
          <div class="eye-toolgroup" role="group" aria-label="画面工具">
            <button id="regionBtn" title="拖动框出只想让 AI 看的区域，省 token" disabled>框选区域</button>
            <button id="fullBtn" class="hidden">全画面</button>
          </div>
          <div class="eye-toolgroup" role="group" aria-label="声音工具">
            <button id="voiceBtn" class="voicebtn" title="宇宙之声：分辨片中每个说话人" disabled>宇宙之声 <b id="voiceState">关</b></button>
            <label class="eye-toggle"><input type="checkbox" id="micChk" disabled>语音对话</label>
            <label class="eye-toggle"><input type="checkbox" id="ttsChk" disabled>朗读</label>
          </div>
          <label class="eye-pace">陪看节奏
            <select id="paceSel" disabled>
              <option value="off">不主动说话</option><option value="calm">安静（30 秒）</option>
              <option value="normal">陪看（15 秒）</option><option value="chatty">话痨（8 秒）</option>
            </select>
          </label>
          <div class="eye-activity"><span>画面变化</span><span class="meter" title="画面变化分（切场景时会跳高）"><i id="meterBar"></i></span></div>
        </div>
        <div class="filmstrip" id="strip"></div>
        <div id="cast" class="cast hidden"></div>
      </div>
      <div class="chatcol">
        <div id="log" class="elog"><div class="empty">开始观看后，直接说话或打字就能问它。按 <b>H</b> 问「现在这个画面怎么样」。</div></div>
        <div class="cmdbox">
          <input id="ask" placeholder="问它点什么…（回车发送）" autocomplete="off" disabled>
          <button id="askBtn" class="primary" disabled>发送</button>
        </div>
        <div class="stat" id="stat"></div>
      </div>
    </div>
  </section>

  <section id="tab-diary" class="tab hidden"></section>
  <section id="tab-voices" class="tab hidden"></section>
  <section id="tab-settings" class="tab hidden"></section>
</main>
<div id="toast" class="hidden"></div>
<script type="module" src="/static/eye.js"></script>
</body>
</html>
