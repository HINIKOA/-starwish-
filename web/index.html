<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/static/favicon.ico"><link rel="apple-touch-icon" href="/static/icons/icon-180.png"><link rel="manifest" href="/static/manifest.json">
<title>星愿记忆 · 记忆星图</title>
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="stage"></div>
<div id="vignette"></div>

<header id="mapChrome">
<div id="topbar">
  <div class="brand"><img class="app-icon" src="/static/icons/icon-192.png" alt=""> 星愿记忆 <small>StarWish</small></div>
  <div class="searchbox">
    <input id="search" type="search" placeholder="搜索记忆（不命中的星会变暗）" autocomplete="off">
    <div id="searchResults" class="dropdown hidden"></div>
  </div>
  <nav>
    <button data-panel="core" class="primary" title="打开核心记忆模块">✦ 核心记忆</button>
    <button data-panel="skills" class="primary" title="打开技能进化模块">✧ 技能进化</button>
    <button data-panel="eye" class="primary" title="宇宙之眼：和 AI 一起看屏幕 / 摄像头（仅主人）"><svg class="ico-eye" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-0.125em"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg> 宇宙之眼</button>
    <button data-panel="proposals">提案 <span id="propBadge" class="badge hidden">0</span></button>
    <button data-panel="add">＋ 新星</button>
    <button data-panel="import">导入</button>
    <button data-panel="sync">备份/整理</button>
    <button data-panel="settings">设置</button>
    <button data-panel="events">日志</button>
  </nav>
</div>
<div class="map-meta">
  <div id="stats" class="stats"></div>
  <div class="map-legend" aria-label="星图图例">
    <span><i class="legend-core" aria-hidden="true"></i>星系核</span>
    <span><i class="legend-system" aria-hidden="true"></i>恒星系</span>
    <span><i class="legend-orbit" aria-hidden="true"></i>行星系</span>
    <span><i class="legend-planet" aria-hidden="true"></i>星球</span>
  </div>
</div>
</header>

<footer id="timeline">
  <span class="tl-label">时间线</span>
  <input id="tlSlider" type="range" min="0" max="1000" value="1000">
  <span id="tlText">全部</span>
  <button id="resetView" title="重置视角">⟲ 视角</button>
  <label class="tl-check"><input type="checkbox" id="autoRotate" checked> 缓慢旋转</label>
</footer>

<div id="emptyHint" class="hidden">现在只有星系核，它装着 AI 是谁、你是谁、你的喜好。<br>新增的记忆会成为星球，分类后归入对应的恒星系和行星系。</div>
<div id="tooltip" class="hidden"></div>
<aside id="drawer" class="hidden">
  <button id="drawerClose" title="关闭">×</button>
  <div id="drawerBody"></div>
</aside>
<div id="toast" class="hidden"></div>
<div id="noThree" class="hidden">
  <h3>3D 星图未能加载</h3>
  <p>没有找到 three.js。离线使用请把 <code>three.module.min.js</code>（0.160 版）放到 <code>web/vendor/</code> 目录；联网时会自动从 CDN 加载。</p>
  <p>其他功能（核心记忆、提案、导入、备份、设置）都可以正常使用。</p>
</div>

<link rel="modulepreload" href="/static/drawers.js">
<script type="module" src="/static/app.js"></script>
</body>
</html>
